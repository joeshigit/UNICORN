<style>
.doc-scanner-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}

.doc-scanner-close{background:none;border:none;color:white;font-size:24px;width:36px;height:36px;cursor:pointer;line-height:1;padding:0;opacity:0.9}
.doc-scanner-close:hover{opacity:1}
.doc-scanner-body{padding:10px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.doc-scanner-stage{position:relative;margin-bottom:10px;background:#111;border-radius:8px;overflow:hidden;flex:1;width:100%;min-height:200px;aspect-ratio:15/17.5;display:flex;align-items:stretch;justify-content:center}
.doc-scanner-stage canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.doc-scanner-stage video{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.doc-scanner-preview-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.doc-scanner-preview-wrap img{max-width:100%;max-height:100%;object-fit:contain}
#doc-sc-prev{max-width:81%;max-height:81%;object-fit:contain}
.doc-scanner-preview-wrap.doc-scanner-preview-grayscale img{filter:grayscale(100%)}
.doc-scanner-controls{display:flex;flex-direction:column;gap:12px}
.doc-scanner-mode{display:flex;gap:16px;font-size:14px;color:#333}
.doc-scanner-mode label{cursor:pointer;display:flex;align-items:center;gap:6px}
.doc-scanner-btns{display:flex;gap:10px;flex-wrap:wrap}
.doc-scanner-btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.2s}
.doc-scanner-btn-capture{background:#4caf50;color:white}
.doc-scanner-btn-capture:hover{background:#43a047}
.doc-scanner-btn-retake{background:#4caf50;color:white}
.doc-scanner-btn-retake:hover{background:#43a047}
.doc-scanner-btn-reshoot{background:#ff9800;color:white}
.doc-scanner-btn-reshoot:hover{background:#f57c00}
.doc-scanner-btn-confirm{background:#1976d2;color:white;font-size:12px;padding:10px 12px}
.doc-scanner-btn-confirm:hover{background:#1565c0}
.doc-scanner-btn-print{background:#00897b;color:white;font-size:12px;padding:10px 12px}
.doc-scanner-btn-print:hover{background:#00796b}
.doc-scanner-printview{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
.doc-scanner-printview.active{display:flex}
.doc-scanner-print-status{font-size:13px;color:#333;font-weight:600;flex:none}
.doc-scanner-print-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.doc-scanner-print-row{display:flex;align-items:center;gap:8px;border:1px solid #e0e0e0;border-radius:8px;padding:8px}
.doc-scanner-print-row canvas{width:52px;height:auto;border:1px solid #e0e0e0;border-radius:4px;display:block;flex:none;background:#fff}
.doc-scanner-print-meta{flex:1;min-width:0;font-size:12px;color:#555;line-height:1.5}
.doc-scanner-print-ok{color:#2e7d32;font-weight:700}
.doc-scanner-print-warn{color:#e65100;font-weight:700}
.doc-scanner-print-mini{padding:6px 10px;border:1px solid #cfd8dc;border-radius:6px;background:#f7f9fa;cursor:pointer;font-size:11px;font-weight:600;flex:none}
.doc-scanner-print-mini.on{background:#00897b;color:#fff;border-color:#00897b}
.doc-scanner-print-editor{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
.doc-scanner-print-editor.active{display:flex}
.doc-scanner-print-editor-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#111;border-radius:8px;overflow:hidden}
.doc-scanner-print-editor-stage canvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}
.doc-scanner-edit-hint{font-size:12px;color:#555;line-height:1.5;flex:none}
.doc-scanner-btn-toggle{background:#5c6bc0;color:white}
.doc-scanner-btn-toggle:hover{background:#3949ab}
.doc-scanner-btn-toggle.active{background:#3949ab;border:2px solid #1a237e}
.doc-scanner-pages{display:flex;flex-wrap:wrap;gap:8px;overflow:auto;max-height:35vh;justify-content:center;padding:8px}
.doc-scanner-page-item{position:relative}
.doc-scanner-page-item img{width:60px;height:auto;border:2px solid #e0e0e0;border-radius:4px;display:block}
.doc-scanner-page-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#f44336;color:white;border:none;cursor:pointer;font-size:14px;line-height:1;padding:0}
.doc-scanner-page-count{font-size:13px;color:#666;margin-bottom:8px;text-align:center}
</style>

if(px<w-1){n=p+1;if(mask[n]&&!labels[n]){labels[n]=label;stack[sp++]=n;}}
if(py>0){n=p-w;if(mask[n]&&!labels[n]){labels[n]=label;stack[sp++]=n;}}
if(py<h-1){n=p+w;if(mask[n]&&!labels[n]){labels[n]=label;stack[sp++]=n;}}}

   一定帶光照漸層，單一增益修好中間、角落仍是灰的。因此白點不用絕對門檻，改為從影像

function prWhitenCanvas(cv,quad){try{

/* 完全按預覽與編輯器顯示的四角裁切，不做任何額外外擴，確保印出來的與看到的一致。 */

function prApplyGray(src){var out=document.createElement("canvas");out.width=src.width;out.height=src.height;

function prIsGray(){return ov.querySelector('input[name="doc-sc-mode"]:checked').value==="gray";}
function prReleaseCanvas(c){if(c&&c.width){c.width=0;c.height=0;}}
function prReleasePages(){if(!prPages)return;for(var i=0;i<prPages.length;i++)prReleaseCanvas(prPages[i].cleaned);prPages=[];}
function prReleaseUrls(){if(!prUrls)return;for(var i=0;i<prUrls.length;i++){try{URL.revokeObjectURL(prUrls[i]);}catch(e){}}prUrls=[];}

function prExitView(){printView.classList.remove("active");printEditorEl.classList.remove("active");stage.style.display="";controlsEl.style.display="";prReleasePages();prReleaseUrls();}
function prStartPreview(){if(prBusy)return;

prBusy=true;prReleasePages();prReleaseUrls();
prEnterView();
printListEl.innerHTML="";
printStatusEl.textContent="正在分析 "+capturedPages.length+" 頁"+(capturedPages.length>PR_PAGE_WARN?"（頁數較多，請稍候）":"")+"…";

function prProcessPage(i){if(i>=capturedPages.length){prBusy=false;prRenderList();return;}

prPages.push({original:src,cleaned:cleaned,quad:res.corners||null,ok:!!cleaned&&res.ok,reason:res.ok?"":res.reason,confidence:res.ok?res.confidence:0,manual:false});

function prThumb(page){var srcC=(page.mode==="original"||!page.cleaned)?page.original:page.cleaned;

var c=document.createElement("canvas");c.width=w;c.height=h;

function prRenderList(){printListEl.innerHTML="";
var savable=0,i;
for(i=0;i<prPages.length;i++){if(prPages[i].cleaned)savable++;}
printStatusEl.textContent="共 "+prPages.length+" 頁，"+savable+" 頁可省墨列印"+(savable<prPages.length?"；其餘保留原圖，可手動調整四角":"");
for(i=0;i<prPages.length;i++){(function(page,idx){
if(!page.mode)page.mode=page.cleaned?"clean":"original";
var row=document.createElement("div");row.className="doc-scanner-print-row";
row.appendChild(prThumb(page));
var meta=document.createElement("div");meta.className="doc-scanner-print-meta";
